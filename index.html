<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa"><title>考研备考工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#20242b;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:78px}.top{padding:22px 18px 12px}.eyebrow{font-size:13px;color:#8a9099}.title{font-size:25px;font-weight:750;margin:5px 0}.sub{color:#777f89;font-size:13px}
.card{background:#fff;border:1px solid #eceef1;border-radius:18px;padding:16px;margin:10px 16px;box-shadow:0 2px 12px #00000006}.hero{background:#20242b;color:white}.hero .muted{color:#bfc5ce}.count{font-size:36px;font-weight:800;margin:4px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;border-radius:14px;background:#f7f8fa}.stat b{font-size:20px;display:block}.label{font-size:12px;color:#808791}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.bar{height:7px;background:#eceef1;border-radius:9px;overflow:hidden;margin:8px 0 12px}.fill{height:100%;background:#343a43;border-radius:9px}.subject{margin:13px 0}.pill{font-size:11px;padding:4px 8px;border-radius:8px;background:#f0f1f3}.task{padding:12px 0;border-bottom:1px solid #f0f1f3}.task:last-child{border:0}.done{text-decoration:line-through;color:#9aa0a8}.btn{border:0;border-radius:11px;padding:9px 12px;background:#252a31;color:#fff;font-weight:650}.btn.light{background:#f0f1f3;color:#30353d}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e9ebee;display:flex;justify-content:center;z-index:5}.tabs button{width:25%;max-width:140px;padding:11px 3px 10px;background:none;border:0;color:#8b929b;font-size:11px}.tabs button.active{color:#20242b;font-weight:700}.tabs span{display:block;font-size:20px;margin-bottom:2px}.section{font-size:16px;font-weight:750;margin-bottom:10px}.hide{display:none}.input{width:100%;padding:11px;border:1px solid #e1e4e8;border-radius:10px;margin:5px 0 9px;background:#fff}.mini{font-size:12px;color:#8a9099}.actions{display:flex;gap:7px;flex-wrap:wrap}.listrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f0f1f3}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 13px;border-radius:10px;font-size:12px;z-index:20}
</style><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"></head>
<body><div class="app" id="app"></div>
<nav class="tabs">
<button data-tab="home" class="active"><span>⌂</span>首页</button>
<button data-tab="plan"><span>✓</span>学习计划</button>
<button data-tab="manage"><span>▦</span>备考管理</button>
<button data-tab="me"><span>○</span>我的</button>
</nav>
<script>
const KEY="kaoyan_complete_v1";
let s=JSON.parse(localStorage.getItem(KEY)||"null")||{
school:"目标院校",score:400,exam:"2026-12-26",
subjects:{英语:62,政治:48,数学:35,专业课:28},
tasks:[
{id:1,text:"英语真题阅读 2 篇",sub:"英语",due:"今天 21:00",priority:"高",done:false},
{id:2,text:"数学高数错题复盘",sub:"数学",due:"今天 18:00",priority:"中",done:false},
{id:3,text:"政治知识点背诵",sub:"政治",due:"明天",priority:"中",done:false}],
hours:3.5,streak:6,checks:[1,1,1,1,0,1,1],papers:[],errors:[],mocks:[],materials:[]
};
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function days(){return Math.max(0,Math.ceil((new Date(s.exam)-new Date())/86400000))}
function pct(){return Math.round(s.subjects.英语*.25+s.subjects.政治*.25+s.subjects.数学*.25+s.subjects.专业课*.25)}
function toast(x){let d=document.createElement("div");d.className="toast";d.textContent=x;document.body.append(d);setTimeout(()=>d.remove(),1400)}
function render(tab="home"){
document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab==tab));
let el=document.getElementById("app");
if(tab=="home") el.innerHTML=home();
if(tab=="plan") el.innerHTML=plan();
if(tab=="manage") el.innerHTML=manage();
if(tab=="me") el.innerHTML=me();
bind(tab);
}
function home(){let done=s.tasks.filter(x=>x.done).length, total=s.tasks.length||1;
return `<div class=top><div class=eyebrow>2026 考研备考</div><div class=title>考研备考工作台</div><div class=sub>${s.school} · 目标 ${s.score} 分</div></div>
<div class="card hero"><div class=muted>距离初试</div><div class=count>${days()} 天</div><div class=muted>考试日期 ${s.exam}</div></div>
<div class="grid"><div class="card stat"><span class=label>今日学习</span><b>${s.hours.toFixed(1)}h</b></div><div class="card stat"><span class=label>本周完成率</span><b>${Math.round(done/total*100)}%</b></div></div>
<div class=card><div class=section>四科备考进度</div>${Object.entries(s.subjects).map(([k,v])=>`<div class=subject><div class=row><span>${k}</span><span class=mini>${v}%</span></div><div class=bar><div class=fill style="width:${v}%"></div></div></div>`).join("")}</div>
<div class=card><div class=row><div class=section>今日任务</div><button class="btn light" onclick="render('plan')">全部</button></div>${s.tasks.slice(0,4).map(taskHTML).join("")}</div>
<div class=card><div class=section>学习数据</div><div class=grid><div class=stat><span class=label>连续打卡</span><b>${s.streak} 天</b></div><div class=stat><span class=label>总任务</span><b>${s.tasks.length}</b></div></div></div>`}
function taskHTML(t){return `<div class=task><div class=row><span class="${t.done?'done':''}">${t.done?'✓ ':''}${t.text}</span><span class=pill>${t.priority}</span></div><div class=mini>${t.sub} · ${t.due}</div></div>`}
function plan(){return `<div class=top><div class=title>学习计划</div><div class=sub>任务可设置科目、截止时间、优先级与完成状态</div></div>
<div class=card><div class=section>新增任务</div><input id=taskText class=input placeholder="例如：英语真题阅读"><div class=grid><select id=taskSub class=input><option>英语</option><option>政治</option><option>数学</option><option>专业课</option></select><select id=taskPri class=input><option>高</option><option selected>中</option><option>低</option></select></div><input id=taskDue class=input placeholder="截止时间，例如 今天 21:00"><button class=btn onclick=addTask()>添加任务</button></div>
<div class=card><div class=section>任务列表</div>${s.tasks.map(t=>`<div class=listrow><div><div class="${t.done?'done':''}">${t.text}</div><div class=mini>${t.sub} · ${t.due} · ${t.priority}</div></div><div class=actions><button class="btn light" onclick="toggleTask(${t.id})">${t.done?'恢复':'完成'}</button><button class="btn light" onclick="deleteTask(${t.id})">删除</button></div></div>`).join("")}</div>`}
function manage(){return `<div class=top><div class=title>备考管理</div><div class=sub>真题、错题、模考和资料集中管理</div></div>
<div class=card><div class=section>真题管理</div><div class=actions><button class=btn onclick=addPaper()>＋记录真题</button></div>${s.papers.map((x,i)=>`<div class=listrow><span>${x}</span><span class=pill>已完成</span></div>`).join("")||'<div class=mini>还没有真题记录</div>'}</div>
<div class=card><div class=section>错题与薄弱点</div><button class=btn onclick=addError()>＋添加薄弱点</button>${s.errors.map(x=>`<div class=listrow><span>${x}</span><span class=pill>待复盘</span></div>`).join("")||'<div class=mini>把易错知识点记录下来，定期复盘</div>'}</div>
<div class=card><div class=section>模考成绩</div><button class=btn onclick=addMock()>＋录入模考</button>${s.mocks.map(x=>`<div class=listrow><span>${x.name}</span><b>${x.score} 分</b></div>`).join("")||'<div class=mini>录入后可持续观察成绩变化</div>'}</div>
<div class=card><div class=section>资料库</div><button class=btn onclick=addMaterial()>＋添加资料</button>${s.materials.map(x=>`<div class=listrow><span>${x}</span><span class=pill>资料</span></div>`).join("")||'<div class=mini>按科目整理讲义、笔记和电子资料</div>'}</div>`}
function me(){return `<div class=top><div class=title>我的</div><div class=sub>目标、计时、打卡与数据管理</div></div>
<div class=card><div class=section>目标设置</div><label class=mini>目标院校</label><input id=school class=input value="${s.school}"><label class=mini>目标分数</label><input id=score class=input type=number value="${s.score}"><label class=mini>考试日期</label><input id=exam class=input type=date value="${s.exam}"><button class=btn onclick=saveGoal()>保存目标</button></div>
<div class=card><div class=section>专注计时</div><div class=count id=timer>25:00</div><div class=actions><button class=btn onclick=startTimer()>开始 25 分钟</button><button class="btn light" onclick=stopTimer()>停止</button></div><div class=mini>完成一次专注后学习时长 +0.4h</div></div>
<div class=card><div class=section>每日打卡</div><div class=mini>连续打卡 ${s.streak} 天</div><button class=btn onclick=checkin()>今日打卡</button></div>
<div class=card><div class=section>数据备份</div><button class=btn onclick=backup()>导出备份</button> <button class="btn light" onclick=restore()>恢复备份</button></div>
<div class=card><div class=section>主题</div><button class="btn light" onclick=toggleTheme()>切换深色模式</button></div>`}
function bind(tab){document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>render(b.dataset.tab))}
function addTask(){let text=taskText.value.trim();if(!text)return; s.tasks.unshift({id:Date.now(),text,sub:taskSub.value,due:taskDue.value||"未设置",priority:taskPri.value,done:false});save();render("plan");toast("任务已添加")}
function toggleTask(id){let t=s.tasks.find(x=>x.id==id);t.done=!t.done;save();render("plan")}
function deleteTask(id){s.tasks=s.tasks.filter(x=>x.id!=id);save();render("plan")}
function addPaper(){let x=prompt("输入真题，例如：英语一 2024");if(x){s.papers.push(x);save();render("manage")}}
function addError(){let x=prompt("输入错题/薄弱点");if(x){s.errors.push(x);save();render("manage")}}
function addMock(){let n=prompt("模考名称");if(!n)return;let x=Number(prompt("总分"));if(!isNaN(x)){s.mocks.push({name:n,score:x});save();render("manage")}}
function addMaterial(){let x=prompt("资料名称");if(x){s.materials.push(x);save();render("manage")}}
function saveGoal(){s.school=school.value||"目标院校";s.score=Number(score.value)||400;s.exam=exam.value||"2026-12-26";save();render("me");toast("目标已保存")}
let timerId=null,sec=1500;
function startTimer(){if(timerId)return;timerId=setInterval(()=>{sec--;document.getElementById("timer").textContent=`${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;if(sec<=0){stopTimer();s.hours+=.4;save();toast("专注完成，学习时长已累计")}},1000);toast("开始专注")}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function checkin(){s.checks.push(1);s.streak++;save();render("me");toast("今日打卡成功")}
function backup(){navigator.clipboard?.writeText(JSON.stringify(s));alert("备份数据已复制到剪贴板，可保存到备忘录。")}
function restore(){let x=prompt("粘贴之前导出的 JSON");try{s=JSON.parse(x);save();render("me");toast("恢复成功")}catch(e){alert("备份格式不正确")}}
function toggleTheme(){document.body.classList.toggle("dark");if(document.body.classList.contains("dark"))document.body.style.filter="invert(.92) hue-rotate(180deg)";else document.body.style.filter="";localStorage.setItem("theme",document.body.style.filter)}
if(localStorage.getItem("theme"))document.body.style.filter=localStorage.getItem("theme");
render();
</script></body></html>
